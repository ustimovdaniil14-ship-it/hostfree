}

 else{const t=q.value.trim().toLowerCase();const L=IT.filter(i=>!t||i.n.toLowerCase().includes(t)).sort((a,b)=>a.p-b.p);
  g.innerHTML=L.length?L.map(i=>card(i,tab=='want'&&target&&target.k==i.k?'s':'')).join(''):'<div class="emp">Ничего не найдено</div>'}
}
$('grid').onclick=async e=>{const el=e.target.closest('.it'),u=U();if(!el||busy)return;const k=+el.dataset.k;
  if(tab=='want')target=target&&target.k==k?null:IT[k];
  else if(sub=='inv'){const id=+el.dataset.i;sel.has(id)?sel.delete(id):sel.add(id)}
  else{if(u.frozen)return toast('Аккаунт заморожен');const it=IT[k];if(u.bal<it.p)return toast('Не хватает ★ на покупку');
   try{const r=await api('/buy',{k});ME=r.me;toast('Куплено: '+it.n)}catch(err){toast(err.message)}}
  render()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('a',x==b));render()});
$('sub').onclick=e=>{const b=e.target.closest('button');if(b){sub=b.dataset.u;render()}};
$('q').oninput=render;$('sa').oninput=render;
$('seg').onclick=e=>{const b=e.target.closest('button');if(b&&!busy){mode=b.dataset.m;render()}};
$('xs').onclick=e=>{const b=e.target.closest('button');if(b&&!busy){X=+b.dataset.x;render()}};
document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{if(busy)return;const u=U();
 if(b.dataset.s){$('sa').value=b.dataset.s=='max'?Math.floor(u.bal):100}
 else{const v=b.dataset.b;bet=v=='max'?u.bal:v=='0'?0:Math.min(u.bal,bet+ +v)}render()});
$('go').onclick=async()=>{
  const u=U(),c=chance();if(!c||busy||u.frozen||u.banned)return;
  const s=spend();if(mode=='nft'&&bet>u.bal)return toast('Не хватает ★');
  busy=true;$('go').disabled=true;$('pl').textContent='крутим…';
  let r;
  try{r=await api('/upgrade',mode=='star'?{mode:'star',amount:s,x:X}:{mode:'nft',ids:[...sel],bet:bet,target:target.k})}
  catch(err){busy=false;toast(err.message);render();return}
  const win=r.win,roll=r.roll,tgt=roll*3.6,cur0=ang%360;
  ang+=(fast?720:2160)+((tgt-cur0)+360)%360;
  const nd=$('nd');nd.style.transitionDuration=fast?'1.6s':'4.2s';nd.style.transform=`rotate(${ang}deg)`;
  await sleep(fast?1700:4300);
  const prize=mode=='star'?fmt(Math.floor(s*X))+' ★':target.n;
  ME=r.me;if(mode=='nft'){sel.clear();bet=0;if(win)target=null}
  busy=false;render();
  $('ctr').className='ctr '+(win?'ok':'bad');$('pc').textContent=win?'ПОБЕДА':'МИМО';$('pl').textContent=win?'получено: '+prize:'выпало '+roll.toFixed(1).replace('.',',')+'%';
  toast(win?'🎉 Вы получили '+prize:'Не повезло, попробуйте ещё');
  setTimeout(()=>{if(!busy){$('ctr').className='ctr';render()}},2600)};
$('plus').onclick=()=>openWallet('dep');
$('fast').onclick=()=>{fast=!fast;$('fast').style.borderColor=fast?'var(--ac2)':'';toast(fast?'Быстрый режим включён':'Быстрый режим выключен')};
/* ===== шторка ===== */
const shOpen=h=>{$('shc').innerHTML=h;$('sh').classList.add('on2')},shClose=()=>$('sh').classList.remove('on2');
$('sh').onclick=e=>{if(e.target==$('sh'))shClose()};
/* ===== темы ===== */
const TH=[['auto','Авто','linear-gradient(135deg,#0b1b3f,#eef4ff)'],['ocean','Океан','#3b82f6'],['navy','Глубина','#2563eb'],['cyan','Неон','#22d3ee'],['indigo','Индиго','#6366f1'],['light','Светлая','#dbeafe']];
let theme='ocean';try{theme=localStorage.getItem('theme')||'ocean'}catch(e){}
function applyTheme(t){theme=t;try{localStorage.setItem('theme',t)}catch(e){}
 const r=t=='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'ocean'):t;document.documentElement.dataset.theme=r;
 setTimeout(()=>document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(),0)}
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(theme=='auto')applyTheme('auto')});
function openTheme(){shOpen(`<h3>Тема оформления</h3><p>Выберите цветовую схему</p><div class="th">${TH.map(t=>`<button class="${t[0]==theme?'a':''}" onclick="applyTheme('${t[0]}');openTheme()"><i style="background:${t[2]};border:1px solid var(--bd)"></i>${t[1]}</button>`).join('')}</div>`)}
$('gear').onclick=openTheme;
/* ===== профиль ===== */
function openProf(){const u=U();
  shOpen(`<div class="row"><div class="av">${esc((u.name[0]||'?').toUpperCase())}</div><div style="min-width:0"><h3 style="margin:0">${esc(u.name)}</h3><div class="mu" style="font-size:13px">ID: ${u.id} <button class="b2" style="padding:3px 8px" onclick="navigator.clipboard&&navigator.clipboard.writeText('${u.id}');toast('ID скопирован')">копировать</button></div>${u.banned?'<span class="tag r">заблокирован</span>':''}${u.frozen?'<span class="tag c">заморожен</span>':''}</div></div>
  <input class="f" id="nm" maxlength="20" value="${esc(u.name)}" placeholder="Имя"><button class="b2" onclick="saveName()">Сохранить имя</button>
  <div class="st"><div>Баланс<b>★ ${fmt(u.bal)}</b></div><div>NFT<b>${u.inv.length}</b></div><div>Игр<b>${u.ups}</b></div><div>Побед<b>${u.wins}</b></div><div>Лучший выигрыш<b>★ ${fmt(u.best)}</b></div><div>Оборот<b>★ ${fmt(u.wag)}</b></div></div>
  <h4>История</h4>${u.h.length?u.h.slice(0,6).map(x=>`<div class="mu" style="font-size:13px;padding:3px 0">${esc(x)}</div>`).join(''):'<div class="mu" style="font-size:13px">Пока пусто</div>'}
  <div class="g2" style="margin-top:14px"><button class="b2" onclick="openTheme()">🎨 Тема</button><span></span></div>${u.isAdmin?'<button class="b2 p" style="width:100%;margin-top:8px" onclick="openAdm()">⚙ Админ-панель</button>':''}`)}
async function saveName(){const v=$('nm').value.trim();if(!v)return;try{const r=await api('/name',{name:v});ME=r.me;render();openProf();toast('Имя сохранено')}catch(e){toast(e.message)}}
$('prof').onclick=openProf;

/* ===== переключатель игр ===== */
const guard=()=>{const u=U();if(u.banned){return toast('Аккаунт заблокирован'),1}if(u.frozen){return toast('Аккаунт заморожен'),1}return 0};
function gameTo(g){['Up','Mines'].forEach(x=>$('g'+x).style.display=x==g?'block':'none');document.querySelectorAll('#gs button').forEach(b=>b.classList.toggle('a',b.dataset.g==g))}
$('gs').onclick=e=>{const b=e.target.closest('button');if(b&&!busy&&!MN.on)gameTo(b.dataset.g)};
const mx=n=>String(Math.round(n*100)/100).replace('.',',');
/* ===== мины ===== */
const MN={on:false,m:3,bet:0,mines:new Set(),open:new Set(),done:false};
$('mset').insertAdjacentHTML('beforeend',[1,3,5,10,24].map(n=>`<button class="ch" data-n="${n}">${n}</button>`).join(''));
const mMult=(m,k)=>{let r=.95;for(let i=0;i<k;i++)r*=(25-i)/(25-m-i);return r};
function mDraw(){const k=MN.open.size,cur=MN.on||MN.done?mMult(MN.m,k):1;
  document.querySelectorAll('#mset [data-n]').forEach(b=>{b.classList.toggle('a',+b.dataset.n==MN.m);b.style.background=+b.dataset.n==MN.m?'var(--ac)':'';b.style.color=+b.dataset.n==MN.m?'var(--on)':''});
  $('mm').textContent='x'+mx(cur);$('mw').textContent='★ '+fmt(MN.bet*cur);
  let h='';for(let i=0;i<25;i++){const o=MN.open.has(i),mi=MN.mines.has(i);h+=`<button data-c="${i}" class="${o?'g':MN.done&&mi?'x':MN.done?'f':''}">${o?'💎':MN.done&&mi?'💣':''}</button>`}
  $('mg').innerHTML=h;$('mgo').textContent=MN.on?(k?`Забрать ★ ${fmt(MN.bet*cur)}`:'Откройте клетку'):'Начать игру';$('mgo').disabled=MN.on&&!k}
document.querySelectorAll('#mset [data-n]').forEach(b=>b.onclick=()=>{if(!MN.on){MN.m=+b.dataset.n;mDraw()}});
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{if(!MN.on)$('mb').value=b.dataset.w=='max'?Math.floor(U().bal):100});
function mFinish(r,msg){ME=r.me;MN.mines=new Set(r.mines);MN.on=false;MN.done=true;render();mDraw();toast(msg)}
$('mg').onclick=async e=>{const b=e.target.closest('button');if(!b||!MN.on||mBusy)return;const i=+b.dataset.c;if(MN.open.has(i))return;mBusy=true;
  try{const r=await api('/mines/open',{i});
    if(r.boom)mFinish(r,'💥 Мина!');
    else{MN.open.add(i);ME=r.me;if(r.win)mFinish(r,'🎉 Забрали ★ '+fmt(r.payout));else{render();mDraw()}}
  }catch(err){toast(err.message)}mBusy=false};
$('mgo').onclick=async()=>{if(mBusy)return;
  if(MN.on){if(!MN.open.size)return;mBusy=true;try{const r=await api('/mines/cash');mFinish(r,'🎉 Забрали ★ '+fmt(r.payout))}catch(err){toast(err.message)}mBusy=false;return}
  if(guard())return;const b=Math.floor(+$('mb').value);if(!b||b<1)return toast('Введите ставку');if(b>U().bal)return toast('Не хватает ★');
  mBusy=true;try{const r=await api('/mines/start',{bet:b,m:MN.m});ME=r.me;MN.bet=b;MN.on=true;MN.done=false;MN.open=new Set();MN.mines=new Set();render();mDraw()}catch(err){toast(err.message)}mBusy=false};
/* ===== кошелёк ===== */
const MAXDEP=100000;
function openWallet(t){const u=U();const tabs=[['dep','Пополнить'],['wd','Вывести'],['nft','NFT'],['pr','Промокод']];
 let b='';
 if(t=='dep')b=`<p>Пополнение звёздами. Максимум за раз — <b>${fmt(MAXDEP)} ★</b>.</p><input class="f" id="wa" type="number" inputmode="numeric" placeholder="Сумма ★" value="100"><div class="chips2">${[100,1000,10000,50000,100000].map(v=>`<button class="ch" onclick="$('wa').value=${v}">${fmt(v)}</button>`).join(' ')}</div><button class="go" style="width:100%;margin:12px 0 0" onclick="doDep()">Пополнить</button>`;
 if(t=='wd')b=`<p>Баланс: <b>★ ${fmt(u.bal)}</b>. Лимит вывода — <b>${fmt(u.wdLimit)} ★</b> в сутки, осталось <b>${fmt(u.wdLeft)} ★</b>.</p><input class="f" id="wa" type="number" inputmode="numeric" placeholder="Сумма ★"><div class="chips2">${[1000,10000,50000,100000].map(v=>`<button class="ch" onclick="$('wa').value=${v}">${fmt(v)}</button>`).join(' ')}</div><button class="go" style="width:100%;margin:12px 0 0" onclick="doWd()">Вывести</button>`;
 if(t=='nft')b=`<p>Отправьте NFT-подарок на аккаунт и напишите администратору свой ID — подарок зачислят в инвентарь.</p><div class="st"><div>Отправить сюда<b style="font-size:19px">@onewinrelay</b></div><div>Ваш ID<b style="font-size:19px">${u.id}</b></div></div><div class="g2"><button class="b2 p" onclick="navigator.clipboard&&navigator.clipboard.writeText('@onewinrelay');toast('Юзернейм скопирован')">Копировать @onewinrelay</button><button class="b2" onclick="navigator.clipboard&&navigator.clipboard.writeText('${u.id}');toast('ID скопирован')">Копировать ID</button></div><p style="font-size:12px">Принимаются только улучшенные NFT-подарки.</p>`;
 if(t=='pr')b=`<p>Введите промокод, чтобы получить звёзды.</p><input class="f" id="wp" placeholder="ПРОМОКОД" style="text-transform:uppercase"><button class="go" style="width:100%;margin:6px 0 0" onclick="doPromo()">Активировать</button>`;
 shOpen(`<h3>💰 Кошелёк</h3><div class="tg2">${tabs.map(x=>`<button class="${x[0]==t?'a':''}" onclick="openWallet('${x[0]}')">${x[1]}</button>`).join('')}</div>${b}`)}
async function doDep(){if(guard())return;const a=Math.floor(+$('wa').value);if(!a||a<10)return toast('Минимум 10 ★');if(a>MAXDEP)return toast('Максимум '+fmt(MAXDEP)+' ★');
  let r;try{r=await api('/deposit',{amount:a})}catch(e){return toast(e.message)}
  const done=async st=>{
    if(st==='paid'){shClose();toast('Платёж получен, зачисляем…');for(let i=0;i<20;i++){await sleep(2000);const d=await sync();if(d>0){toast('Зачислено ★ '+fmt(d));break}}}
    else if(st==='failed')toast('Платёж не прошёл')};
  const slug=(r.link.match(/invoice\/([^/?#]+)/)||[])[1],vs=[r.link];if(slug)vs.push('https://t.me/$'+slug);
  let ok=false;for(const v of vs){try{tg.openInvoice(v,done);ok=true;break}catch(e){}}
  if(!ok){try{await api('/deposit_chat',{amount:a});toast('Счёт отправлен в чат с ботом');shClose()}catch(e){toast(e.message)}}}
async function doWd(){if(guard())return;const a=Math.floor(+$('wa').value),u=U();if(!a||a<10)return toast('Минимум 10 ★');if(a>u.bal)return toast('Не хватает ★');if(a>u.wdLeft)return toast('Лимит вывода на сегодня: осталось '+fmt(u.wdLeft)+' ★');
  try{const r=await api('/withdraw',{amount:a});ME=r.me;render();shClose();toast(r.status=='pending'?'Вывод ★ '+fmt(a)+' обрабатывается':'Выведено ★ '+fmt(a))}catch(e){toast(e.message)}}
async function doPromo(){if(guard())return;const c=$('wp').value.trim();if(!c)return;
  try{const r=await api('/promo',{code:c});ME=r.me;render();shClose();toast('Промокод активирован: +★ '+fmt(r.amount))}catch(e){toast(e.message)}}
/* ===== админ-панель ===== */
let AQ='';
async function openAdm(){
  let o;try{o=await api('/admin/overview')}catch(e){return toast(e.message)}
  shOpen(`<h3>⚙ Админ-панель</h3><p>Игроков: ${fmt(o.users)} · онлайн: ${fmt(o.online)}<br>На балансах: ★ ${fmt(o.bal)} · пополнено: ★ ${fmt(o.dep)} · выведено: ★ ${fmt(o.wd)}<br>Банов: ${o.bans} · заморожено: ${o.frozen}</p>
  <h4>Администраторы</h4>${o.admins.map(a=>`<div class="ur"><span>${esc(a.name)} <span class="mu" style="font-weight:500">${a.id}</span>${a.owner?' <span class="tag c">владелец</span>':''}</span>${ME.isOwner&&!a.owner?`<button class="b2 d" onclick="admRole('${a.id}',false)">Снять</button>`:''}</div>`).join('')}
  <h4>Игроки</h4><input class="f" id="aq" placeholder="ID, имя или @ник" value="${esc(AQ)}" oninput="AQ=this.value;admSearch()"><div id="al"></div>
  <h4>Рассылка</h4><textarea class="f" id="bc" rows="3" placeholder="Текст сообщения для всех игроков"></textarea><button class="b2 p" style="width:100%" onclick="admBc()">Отправить всем</button>`);
  admSearch();
}
let admT=0;
function admSearch(){clearTimeout(admT);admT=setTimeout(async()=>{
  try{const r=await api('/admin/users?q='+encodeURIComponent(AQ)),el=$('al');if(!el)return;
    el.innerHTML=r.users.length?r.users.map(u=>`<button class="ur" onclick="admUser('${u.id}')"><span>${esc(u.name)}${u.username?' <span class="mu" style="font-weight:500">@'+esc(u.username)+'</span>':''}<span class="mu" style="font-weight:500;font-size:12px"> ${u.id}</span>${u.banned?'<span class="tag r">бан</span>':''}${u.frozen?'<span class="tag c">фриз</span>':''}</span><span>★ ${fmt(u.bal)}</span></button>`).join(''):'<div class="mu" style="padding:8px">Никого не найдено</div>'}
  catch(e){toast(e.message)}},250)}
async function admUser(id){
  let u;try{u=await api('/admin/user?id='+id)}catch(e){return toast(e.message)}
  const cnt={};u.inv.forEach(k=>cnt[k]=(cnt[k]||0)+1);
  shOpen(`<button class="b2" onclick="openAdm()">← К списку</button>
  <h3 style="margin-top:12px">${esc(u.name)} ${u.admin?'<span class="tag c">админ</span>':''}${u.banned?'<span class="tag r">бан</span>':''}${u.frozen?'<span class="tag c">фриз</span>':''}</h3>
  <p>ID: ${u.id}${u.username?' · @'+esc(u.username):''}<br>Был: ${u.seen}</p>
  <div class="st"><div>Баланс<b>★ ${fmt(u.bal)}</b></div><div>NFT<b>${u.inv.length}</b></div><div>Пополнил<b>★ ${fmt(u.deposited)}</b></div><div>Вывел<b>★ ${fmt(u.withdrawn)}</b></div><div>Игр / побед<b>${u.played} / ${u.won}</b></div><div>Вывод сегодня<b>★ ${fmt(u.wdUsed)}</b></div></div>
  <h4>Баланс</h4><div class="row"><input class="f" id="am" type="number" inputmode="numeric" placeholder="Сумма ★ (−  чтобы списать)" style="margin:0"></div>
  <div class="g2"><button class="b2 p" onclick="admBal('${u.id}','add')">Начислить</button><button class="b2" onclick="admBal('${u.id}','set')">Установить</button></div>
  <h4>Выдать NFT</h4><select class="f" id="an">${IT.map(i=>`<option value="${i.k}">${esc(i.n)} — ★${fmt(i.p)}</option>`).join('')}</select>
  <div class="row"><input class="f" id="ac" type="number" inputmode="numeric" value="1" min="1" max="20" style="margin:0;width:80px"><button class="b2 p" style="flex:1" onclick="admNft('${u.id}')">Выдать</button></div>
  ${Object.keys(cnt).length?`<div class="mu" style="font-size:12px;margin:8px 0">${Object.entries(cnt).map(([k,n])=>esc(IT[k].n)+(n>1?' ×'+n:'')).join(', ')}</div><button class="b2 d" style="width:100%" onclick="admNftClear('${u.id}')">Забрать все NFT</button>`:''}
  <h4>Ограничения</h4><div class="g2"><button class="b2 d" onclick="admFlag('${u.id}','banned',${!u.banned})">${u.banned?'Разбанить':'Забанить'}</button><button class="b2" onclick="admFlag('${u.id}','frozen',${!u.frozen})">${u.frozen?'Разморозить':'Заморозить'}</button></div>
  ${ME.isOwner&&!u.owner?`<h4>Права</h4><button class="b2 ${u.admin?'d':'p'}" style="width:100%" onclick="admRole('${u.id}',${!u.admin},true)">${u.admin?'Снять админку':'Выдать админку'}</button>`:''}`);
}
async function admCall(path,body,msg,id){try{await api(path,body);toast(msg);id?admUser(id):openAdm()}catch(e){toast(e.message)}}
function admBal(id,mode){const v=Math.floor(+$('am').value);if(!Number.isFinite(v)||(mode=='add'&&!v))return toast('Введите сумму');admCall('/admin/balance',{uid:id,amount:v,mode},'Готово',id).then(()=>{if(id==ME.id)sync()})}
function admNft(id){admCall('/admin/nft',{uid:id,k:+$('an').value,count:+$('ac').value||1},'NFT выдан',id).then(()=>{if(id==ME.id)sync()})}
function ask(m,cb){try{if(tg&&tg.showConfirm)return tg.showConfirm(m,ok=>{if(ok)cb()})}catch(e){}cb()}
function admNftClear(id){ask('Забрать все NFT?',()=>admCall('/admin/nft',{uid:id,action:'clear'},'NFT забраны',id).then(()=>{if(id==ME.id)sync()}))}
function admFlag(id,flag,value){admCall('/admin/flag',{uid:id,flag,value},value?'Применено':'Снято',id)}
function admRole(id,value,fromUser){ask(value?'Выдать админку?':'Снять админку?',()=>admCall('/admin/role',{uid:id,value},value?'Админка выдана':'Админка снята',fromUser?id:null))}
async function admBc(){const t=$('bc').value.trim();if(!t)return toast('Введите текст');ask('Отправить всем игрокам?',async()=>{try{const r=await api('/admin/broadcast',{text:t});$('bc').value='';toast('Рассылка запущена: '+r.total+' игроков')}catch(e){toast(e.message)}})}

function boot(){sync();setInterval(sync,12000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()})}
applyTheme(theme);render();mDraw();boot();
</script>
